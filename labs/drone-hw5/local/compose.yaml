name: hw5-public-sitl-candidate
services:
  sim:
    build: .
    platform: linux/amd64
    init: true
    command: ["/lab/start.sh"]
    environment:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GZ_SIM_HEADLESS_RENDERING: "1"
    volumes:
      - ./runs:/runs
      - ./attack.py:/lab/attack.py:ro
      - ./student_watchdog.py:/lab/student_watchdog.py:ro
    mem_limit: 6g
    cpus: 4
    pids_limit: 512
    stop_grace_period: 20s
