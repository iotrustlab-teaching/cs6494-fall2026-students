<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">OpenPLC Editor representation versus live Runtime artifact</title>
  <desc id="desc">The optional Editor opens PLCopen XML and a Beremiz descriptor for visual inspection, but the emitted XML lacks located AT bindings. The live path mounts controller.st, compiles it through the OpenPLC Runtime toolchain, generates C and I/O glue, and executes the native controller.</desc>
  <rect width="1200" height="450" fill="#f8fafc"/>
  <style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#334155}.editor{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.runtime{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.warn{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <text x="40" y="48" class="h">Figure 7. Editor view and Runtime execution are different paths</text>
  <text x="280" y="95" text-anchor="middle" class="t">Optional visual exploration</text>
  <rect x="45" y="125" width="220" height="105" rx="12" class="editor"/><text x="155" y="164" text-anchor="middle" class="t">plc.xml</text><text x="155" y="194" text-anchor="middle" class="s">PLCopen representation</text>
  <rect x="45" y="265" width="220" height="80" rx="12" class="editor"/><text x="155" y="299" text-anchor="middle" class="t">beremiz.xml</text><text x="155" y="327" text-anchor="middle" class="s">project descriptor</text>
  <path d="M265 178H350" class="arrow"/><path d="M265 305H350" class="arrow"/>
  <rect x="350" y="170" width="230" height="125" rx="12" class="editor"/><text x="465" y="210" text-anchor="middle" class="t">OpenPLC Editor</text><text x="465" y="244" text-anchor="middle" class="s">POU + variables + ST body</text><text x="465" y="274" text-anchor="middle" class="s">not deployment evidence</text>
  <rect x="315" y="335" width="300" height="70" rx="12" class="warn"/><text x="465" y="365" text-anchor="middle" class="t">Current XML limitation</text><text x="465" y="391" text-anchor="middle" class="s">does not retain %MD0 / %QX0.0 AT bindings</text>
  <line x1="640" y1="90" x2="640" y2="410" stroke="#94a3b8" stroke-width="2"/>
  <text x="900" y="95" text-anchor="middle" class="t">Required live execution</text>
  <rect x="690" y="135" width="190" height="100" rx="12" class="runtime"/><text x="785" y="174" text-anchor="middle" class="t">controller.st</text><text x="785" y="204" text-anchor="middle" class="s">located AT bindings</text>
  <path d="M880 185H945" class="arrow"/>
  <rect x="945" y="125" width="210" height="120" rx="12" class="runtime"/><text x="1050" y="162" text-anchor="middle" class="t">Runtime compiler</text><text x="1050" y="194" text-anchor="middle" class="s">ST → C + I/O glue</text><text x="1050" y="222" text-anchor="middle" class="s">native OpenPLC process</text>
  <path d="M1050 245V315" class="arrow"/>
  <rect x="900" y="315" width="300" height="85" rx="12" class="runtime"/><text x="1050" y="350" text-anchor="middle" class="t">Real scan + Modbus objects</text><text x="1050" y="378" text-anchor="middle" class="s">runtime and packet evidence</text>
</svg>
