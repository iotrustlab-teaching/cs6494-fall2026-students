<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Evidence layers, validation, and the physical-property oracle</title>
  <desc id="desc">A bundle contains network, observation, controller, actuator, and process layers on one clock. Validation checks structure and checksums. The physical property oracle consumes process truth, while the summary chooses the minimum evidence for each claim.</desc>
  <rect width="1200" height="470" fill="#f8fafc"/>
  <style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#334155}.layer{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.tool{fill:#fff;stroke:#64748b;stroke-width:2}.oracle{fill:#fff7ed;stroke:#b45309;stroke-width:2}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <text x="40" y="48" class="h">Figure 6. Evidence is layered; the oracle names its source</text>
  <g class="layer"><rect x="45" y="95" width="185" height="55" rx="10"/><rect x="45" y="165" width="185" height="55" rx="10"/><rect x="45" y="235" width="185" height="55" rx="10"/><rect x="45" y="305" width="185" height="55" rx="10"/><rect x="45" y="375" width="185" height="55" rx="10"/></g>
  <text x="137" y="130" text-anchor="middle" class="t">network.pcap</text><text x="137" y="200" text-anchor="middle" class="t">observations.csv</text><text x="137" y="270" text-anchor="middle" class="t">controller.csv</text><text x="137" y="340" text-anchor="middle" class="t">actions.csv</text><text x="137" y="410" text-anchor="middle" class="t">process.csv</text>
  <path d="M230 122H330" class="arrow"/><path d="M230 192H330" class="arrow"/><path d="M230 262H330" class="arrow"/><path d="M230 332H330" class="arrow"/><path d="M230 402H330" class="arrow"/>
  <rect x="330" y="130" width="260" height="230" rx="12" class="tool"/><text x="460" y="170" text-anchor="middle" class="t">collect.sh / validate_bundle</text><text x="460" y="205" text-anchor="middle" class="s">required files + columns</text><text x="460" y="235" text-anchor="middle" class="s">schema + pcap presence</text><text x="460" y="265" text-anchor="middle" class="s">cross-file verdict agreement</text><text x="460" y="295" text-anchor="middle" class="s">SHA-256 manifest coverage</text><text x="460" y="330" text-anchor="middle" class="s">valid bundle ≠ correct causal claim</text>
  <path d="M590 220H690" class="arrow"/>
  <rect x="690" y="105" width="250" height="155" rx="12" class="oracle"/><text x="815" y="145" text-anchor="middle" class="t">property_oracle.py</text><text x="815" y="180" text-anchor="middle" class="s">reads process.csv</text><text x="815" y="210" text-anchor="middle" class="s">true level &lt; 90%</text><text x="815" y="240" text-anchor="middle" class="s">finite-trace verdict</text>
  <rect x="690" y="295" width="250" height="115" rx="12" class="tool"/><text x="815" y="335" text-anchor="middle" class="t">evidence_summary.py</text><text x="815" y="368" text-anchor="middle" class="s">minimum fields for claim</text><text x="815" y="395" text-anchor="middle" class="s">reports oracle disagreement</text>
  <path d="M940 182H1030" class="arrow"/><path d="M940 352H1030" class="arrow"/>
  <rect x="1030" y="155" width="135" height="230" rx="12" class="layer"/><text x="1097" y="195" text-anchor="middle" class="t">Memo</text><text x="1097" y="230" text-anchor="middle" class="s">program</text><text x="1097" y="260" text-anchor="middle" class="s">runtime</text><text x="1097" y="290" text-anchor="middle" class="s">network</text><text x="1097" y="320" text-anchor="middle" class="s">physical</text><text x="1097" y="350" text-anchor="middle" class="s">verdict</text>
</svg>
