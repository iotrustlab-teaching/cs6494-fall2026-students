<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Static analysis artifact pipeline</title>
  <desc id="desc">The analysis wrapper sends the teaching C controller to static_view.py, which parses the supported statements and derives a DOT control-flow graph and JSON dependency map from actual branch paths. Those artifacts establish a feasible influence path but not execution or physical reachability.</desc>
  <rect width="1200" height="410" fill="#f8fafc"/>
  <style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.t{font-size:19px}.s{font-size:16px;fill:#334155}.source{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.tool{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.artifact{fill:#fff7ed;stroke:#b45309;stroke-width:2}.warn{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <text x="40" y="48" class="h">Figure 2. Static structure becomes inspectable evidence</text>
  <rect x="45" y="110" width="230" height="105" rx="12" class="source"/><text x="160" y="148" text-anchor="middle" class="t">controller.c</text><text x="160" y="178" text-anchor="middle" class="s">source representation</text>
  <path d="M275 162H355" class="arrow"/>
  <rect x="355" y="90" width="270" height="145" rx="12" class="tool"/><text x="490" y="128" text-anchor="middle" class="t">static_view.py</text><text x="385" y="162" class="s">parses if / else / return</text><text x="385" y="192" class="s">derives CFG + retention</text>
  <path d="M625 135H715" class="arrow"/><path d="M625 195H715" class="arrow"/>
  <rect x="715" y="70" width="220" height="105" rx="12" class="artifact"/><text x="825" y="110" text-anchor="middle" class="t">controller_cfg.dot</text><text x="825" y="140" text-anchor="middle" class="s">branches + paths</text>
  <rect x="715" y="200" width="220" height="105" rx="12" class="artifact"/><text x="825" y="240" text-anchor="middle" class="t">dependency_map.json</text><text x="825" y="270" text-anchor="middle" class="s">input → state → output</text>
  <path d="M935 122H1000" class="arrow"/><path d="M935 252H1000" class="arrow"/>
  <rect x="1000" y="105" width="160" height="165" rx="12" class="warn"/><text x="1080" y="145" text-anchor="middle" class="t">Bounded claim</text><text x="1080" y="180" text-anchor="middle" class="s">can influence</text><text x="1080" y="208" text-anchor="middle" class="s">≠ did execute</text><text x="1080" y="236" text-anchor="middle" class="s">≠ reachable failure</text>
  <text x="45" y="355" class="s">Try a C source copy with --source; unsupported control flow is rejected.</text>
</svg>
