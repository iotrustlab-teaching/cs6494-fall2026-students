<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Compiler- and analyzer-grounded static evidence</title>
  <desc id="desc">The controller C source goes to Clang for a control-flow graph and to Frama-C Eva for input, output, and SELF dependencies. The wrapper retains raw output and creates readable projections, which do not prove live execution.</desc>
  <rect width="1200" height="440" fill="#f8fafc"/>
  <style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:27px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:15px;fill:#334155}.source{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.tool{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.artifact{fill:#fff7ed;stroke:#b45309;stroke-width:2}.warn{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <text x="40" y="48" class="h">Figure 2. Static evidence comes from real analysis tools</text>
  <rect x="42" y="153" width="190" height="94" rx="12" class="source"/>
  <text x="137" y="190" text-anchor="middle" class="t">controller.c</text>
  <text x="137" y="218" text-anchor="middle" class="s">source + harness</text>
  <path d="M232 178H300V132H338" class="arrow"/>
  <path d="M232 218H300V285H338" class="arrow"/>
  <rect x="338" y="78" width="242" height="108" rx="12" class="tool"/>
  <text x="459" y="117" text-anchor="middle" class="t">Clang</text>
  <text x="459" y="145" text-anchor="middle" class="s">debug.DumpCFG</text>
  <rect x="338" y="232" width="242" height="108" rx="12" class="tool"/>
  <text x="459" y="271" text-anchor="middle" class="t">Frama-C Eva</text>
  <text x="459" y="299" text-anchor="middle" class="s">-deps / SELF</text>
  <path d="M580 132H650" class="arrow"/>
  <path d="M580 286H650" class="arrow"/>
  <rect x="650" y="78" width="258" height="108" rx="12" class="artifact"/>
  <text x="779" y="116" text-anchor="middle" class="t">raw Clang CFG</text>
  <text x="779" y="145" text-anchor="middle" class="s">DOT / SVG projection</text>
  <rect x="650" y="232" width="258" height="108" rx="12" class="artifact"/>
  <text x="779" y="270" text-anchor="middle" class="t">raw Eva dependencies</text>
  <text x="779" y="299" text-anchor="middle" class="s">JSON projection</text>
  <path d="M908 132H968V208H990" class="arrow"/>
  <path d="M908 286H968V232H990" class="arrow"/>
  <rect x="990" y="157" width="170" height="135" rx="12" class="warn"/>
  <text x="1075" y="193" text-anchor="middle" class="t">Bounded claim</text>
  <text x="1075" y="222" text-anchor="middle" class="s">can influence</text>
  <text x="1075" y="247" text-anchor="middle" class="s">≠ did execute</text>
  <text x="1075" y="271" text-anchor="middle" class="s">≠ physical failure</text>
  <text x="42" y="396" class="s">The wrapper preserves raw output, records versions and commands, and makes no substitute dependency claim if Frama-C is missing.</text>
</svg>
